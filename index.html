<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3345;
      --text: #e8eaed;
      --text-muted: #9aa0b0;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --success: #3dd68c;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 1rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .type-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: center;
    }
    .type-btn:hover { border-color: var(--accent); background: #2a3048; }
    .type-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    select, input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      min-width: 100px;
    }
    select:focus, input:focus { outline: none; border-color: var(--accent); }
    .generate-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-left: auto;
    }
    .generate-btn:hover { background: var(--accent-hover); }
    .generate-btn:active { transform: scale(0.98); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .results { min-height: 80px; }
    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Menlo, monospace;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }
    .result-item .text { word-break: break-all; }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      flex-shrink: 0;
      margin-left: 12px;
      transition: all 0.15s ease;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }
    .empty, .loading { color: var(--text-muted); text-align: center; padding: 24px; font-size: 0.95rem; }
    footer { text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.85rem; }
    @media (max-width: 520px) {
      .controls { flex-direction: column; align-items: stretch; }
      .generate-btn { margin-left: 0; width: 100%; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Random Generator</h1>
      <p>Generate random English words, names, places &amp; variable names</p>
    </header>

    <div class="card">
      <div class="type-grid" id="typeGrid">
        <button class="type-btn active" data-type="variable">Variable / Slug</button>
        <button class="type-btn" data-type="name">Full Name</button>
        <button class="type-btn" data-type="firstname">First Name</button>
        <button class="type-btn" data-type="lastname">Last Name</button>
        <button class="type-btn" data-type="place">Place</button>
        <button class="type-btn" data-type="adjective">Adjective</button>
        <button class="type-btn" data-type="noun">Noun</button>
        <button class="type-btn" data-type="word">Random Word</button>
      </div>

      <div class="controls">
        <div class="control-group">
          <label for="count">Count</label>
          <input type="number" id="count" value="5" min="1" max="50" />
        </div>
        <div class="control-group" id="styleGroup">
          <label for="style">Style</label>
          <select id="style">
            <option value="">kebab-case (default)</option>
            <option value="camel">camelCase</option>
            <option value="snake">snake_case</option>
            <option value="pascal">PascalCase</option>
          </select>
        </div>
        <div class="control-group" id="sepGroup">
          <label for="separator">Separator</label>
          <select id="separator">
            <option value="-">-</option>
            <option value="_">_</option>
            <option value=" ">space</option>
            <option value="">none</option>
          </select>
        </div>
        <button class="generate-btn" id="generateBtn" disabled>Loading…</button>
      </div>

      <div class="results" id="results">
        <div class="loading">Loading word lists…</div>
      </div>
    </div>

    <footer>
      Static page · Word lists stored as separate JSON files · Deployed on Cloudflare Pages
    </footer>
  </div>

  <script>
    let DICTS = null;
    let currentType = "variable";

    async function loadDicts() {
      const [adjectives, nouns, firstNames, lastNames, places] = await Promise.all([
        fetch("./dicts/adjectives.json").then(r => r.json()),
        fetch("./dicts/nouns.json").then(r => r.json()),
        fetch("./dicts/first-names.json").then(r => r.json()),
        fetch("./dicts/last-names.json").then(r => r.json()),
        fetch("./dicts/places.json").then(r => r.json()),
      ]);
      DICTS = { adjectives, nouns, firstNames, lastNames, places };
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generate(type, count, options = {}) {
      const results = [];
      const sep = options.separator ?? "-";
      const style = options.style || "";

      for (let i = 0; i < count; i++) {
        let value;
        switch (type) {
          case "variable":
          case "slug": {
            value = `${pick(DICTS.adjectives)}${sep}${pick(DICTS.nouns)}`;
            if (style === "camel") {
              value = value.split(sep).map((w, idx) =>
                idx === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
              ).join("");
            } else if (style === "snake") {
              value = value.split(sep).join("_");
            } else if (style === "pascal") {
              value = value.split(sep).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join("");
            }
            break;
          }
          case "name":
          case "person":
            value = `${pick(DICTS.firstNames)} ${pick(DICTS.lastNames)}`;
            break;
          case "firstname":
            value = pick(DICTS.firstNames);
            break;
          case "lastname":
            value = pick(DICTS.lastNames);
            break;
          case "place":
            value = `${pick(DICTS.adjectives)} ${pick(DICTS.places)}`;
            break;
          case "adjective":
            value = pick(DICTS.adjectives);
            break;
          case "noun":
            value = pick(DICTS.nouns);
            break;
          case "word":
            value = pick([...DICTS.adjectives, ...DICTS.nouns]);
            break;
          default:
            value = `${pick(DICTS.adjectives)}${sep}${pick(DICTS.nouns)}`;
        }
        results.push(value);
      }
      return results;
    }

    const typeGrid = document.getElementById("typeGrid");
    const generateBtn = document.getElementById("generateBtn");
    const resultsEl = document.getElementById("results");
    const countInput = document.getElementById("count");
    const styleSelect = document.getElementById("style");
    const sepSelect = document.getElementById("separator");
    const styleGroup = document.getElementById("styleGroup");
    const sepGroup = document.getElementById("sepGroup");

    function updateControlsVisibility() {
      const show = currentType === "variable" || currentType === "slug";
      styleGroup.style.display = show ? "flex" : "none";
      sepGroup.style.display = show ? "flex" : "none";
    }

    typeGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".type-btn");
      if (!btn) return;
      typeGrid.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
      updateControlsVisibility();
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(str) {
      return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function doGenerate() {
      if (!DICTS) return;
      const count = Math.min(Math.max(parseInt(countInput.value) || 1, 1), 50);
      const items = generate(currentType, count, {
        style: styleSelect.value,
        separator: sepSelect.value
      });

      resultsEl.innerHTML = items.map(text => `
        <div class="result-item">
          <span class="text">${escapeHtml(text)}</span>
          <button class="copy-btn" data-text="${escapeAttr(text)}">Copy</button>
        </div>`).join("");

      resultsEl.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.text);
            btn.textContent = "Copied!";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.textContent = "Copy";
              btn.classList.remove("copied");
            }, 1500);
          } catch {
            btn.textContent = "Failed";
          }
        });
      });
    }

    generateBtn.addEventListener("click", doGenerate);
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && !generateBtn.disabled) doGenerate();
    });

    updateControlsVisibility();
    loadDicts()
      .then(() => {
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";
        doGenerate();
      })
      .catch(err => {
        resultsEl.innerHTML = `<div class="empty">Failed to load word lists: ${err.message}</div>`;
        generateBtn.textContent = "Error";
      });
  </script>
</body>
</html>
